name: EAS Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Development APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS
        run: npx eas-cli build:configure --non-interactive

      - name: Build Android Development
        run: npx eas-cli build --platform android --profile development --non-interactive --wait

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinet-apk
          path: |
            **/*.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK available as artifact: **kinet-apk**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK from the artifacts above" >> $GITHUB_STEP_SUMMARY
          echo "2. Install on your Android device" >> $GITHUB_STEP_SUMMARY
          echo "3. Or download from [Expo Dashboard](https://expo.dev/accounts/zoxhesh/projects/kinet/builds)" >> $GITHUB_STEP_SUMMARY

  # Optional: Production build on tag
  build-production:
    name: Build Android Production APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Production
        run: npx eas-cli build --platform android --profile production --non-interactive --wait

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: kinet-apk-production
          path: |
            **/*.apk
          retention-days: 90